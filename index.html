<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La transition — Jeu 5</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #EDF1F2; --surface: #FFFFFF; --surface-2: #F6F8F9; --ink: #15202B; --muted: #566572; --line: #CFD8DD;
  --elec: #0E7C9E; --elec-soft: #D5ECF3; --fossil: #8A5A2B; --fossil-soft: #F1E6DA;   --alert: #B3261E; --alert-soft: #F8E1DF; --ok: #2E7D4F;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161C; --surface: #17212A; --surface-2: #1D2933; --ink: #E6EDF2; --muted: #93A3B0; --line: #2C3A46;
    --elec: #3CB4D6; --elec-soft: #143845; --fossil: #C9945E; --fossil-soft: #3A2A1B;     --alert: #EF6B5E; --alert-soft: #45201C; --ok: #5FC28A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161C; --surface: #17212A; --surface-2: #1D2933; --ink: #E6EDF2; --muted: #93A3B0; --line: #2C3A46;
  --elec: #3CB4D6; --elec-soft: #143845; --fossil: #C9945E; --fossil-soft: #3A2A1B;   --alert: #EF6B5E; --alert-soft: #45201C; --ok: #5FC28A;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Archivo", "Arial Narrow", Arial, sans-serif; font-size: 16px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 18px 48px; }
h1, h2, h3 { margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; font-stretch: 75%; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; font-stretch: 85%; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .6em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
button, input, select { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600;
}
button.primary { background: var(--elec); border-color: var(--elec); color: #fff; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--elec); outline-offset: 2px; }
input[type=number], select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type=number] { width: 7.5em; }
label { display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
@media (min-width: 900px) { .cols-2 { grid-template-columns: 1.35fr 1fr; } .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* En-tête */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top .sub { font-stretch: 90%; color: var(--muted); }

/* La ligne du réseau : élément central */
.reseau { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.reseau-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.charge { position: relative; height: 34px; margin: 14px 0 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.charge .remplissage { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--elec) 0 10px, color-mix(in srgb, var(--elec) 82%, transparent) 10px 12px); transition: width .5s ease; }
.charge.surcharge .remplissage { background: repeating-linear-gradient(90deg, var(--alert) 0 10px, color-mix(in srgb, var(--alert) 82%, transparent) 10px 12px); }
.charge .limite { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); }
.charge .etiquette { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 8px; }
.charge .etiquette span { background: var(--surface); color: var(--ink); font-weight: 700; font-size: .85rem; padding: 2px 8px; border-radius: 4px; }
.indicateurs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.ind .val { font-size: 1.6rem; font-weight: 800; font-stretch: 70%; line-height: 1.05; }
.ind .lab { font-size: .85rem; color: var(--muted); }
.ind.elec .val { color: var(--elec); } .ind.fossil .val { color: var(--fossil); }
.evenement { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--alert); background: var(--alert-soft); border-radius: 4px; }

/* Onglets entreprises */
.onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.onglets button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Opérations */
.ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 12px 0 4px; }
.op { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--fossil-soft); }
.op.electrifiee { background: var(--elec-soft); }
.op .etat { font-size: .8rem; font-weight: 700; color: var(--fossil); }
.op.electrifiee .etat { color: var(--elec); }
.op dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0 0; font-size: .85rem; }
.op dt { color: var(--muted); } .op dd { margin: 0; text-align: right; font-weight: 600; }

.bloc { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.ligne { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.ligne label { font-size: .875rem; color: var(--muted); }
.ligne label > input, .ligne label > select { display: block; margin-top: 4px; color: var(--ink); }
.radio { display: flex; gap: 14px; flex-wrap: wrap; }
.radio label { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: .95rem; }
.note { font-size: .875rem; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); margin-top: 8px; }
.note.ok { background: var(--elec-soft); }
.note.alerte { background: var(--alert-soft); }
.estim { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; margin-top: 10px; font-size: .9rem; }
.estim b { display: block; font-size: 1.1rem; }

/* Tableaux */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); font-size: .8rem; }
tr.humain td { background: var(--elec-soft); }
.neg { color: var(--alert); }
.oui { color: var(--fossil); font-weight: 700; }
.journal { margin: 0; padding-left: 18px; }
.journal li { margin-bottom: 4px; }
.journal .t { color: var(--muted); font-weight: 700; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }

/* Configuration */
.config-entreprises { display: grid; gap: 8px; margin: 10px 0; }
.config-entreprises .rangee { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
details summary { cursor: pointer; font-weight: 700; margin: 8px 0; }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 16px; }
.params label { font-size: .85rem; color: var(--muted); }
.params input { display: block; width: 100%; margin-top: 3px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.cache { display: none !important; }
@media (prefers-reduced-motion: reduce) { .charge .remplissage { transition: none; } }
.chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
.ch { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--fossil-soft); }
.ch.electrifiee { background: var(--elec-soft); }
.ch.choisie { outline: 3px solid var(--elec); outline-offset: -3px; }
.ch .etat { font-size: .8rem; font-weight: 700; color: var(--fossil); }
.ch.electrifiee .etat, .ch.choisie .etat { color: var(--elec); }
.ch h3 .small { font-weight: 500; }
.ch dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0 0; font-size: .82rem; }
.ch dt { color: var(--muted); } .ch dd { margin: 0; text-align: right; font-weight: 600; }
.ch .coche { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: .88rem; font-weight: 600; }
.pos { color: var(--ok); }
.bilan { border: 2px solid var(--ink); margin-bottom: 16px; }
.bilan h2 { font-size: 1.45rem; }
.reseau { margin-top: 0; }
button:disabled { opacity: .45; cursor: not-allowed; }
.sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 8px 0 12px; }
.sources > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.sources .val { font-weight: 800; font-size: 1.1rem; }
#evSeq select { width: 100%; }
.etoiles { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.etoiles button { font-size: 1.7rem; line-height: 1; background: none; border: none; color: var(--line); cursor: pointer; padding: 2px 4px; }
.etoiles button.pleine { color: var(--fossil); }
.etoiles button:focus-visible { outline: 3px solid var(--elec); border-radius: 4px; }
.centre { text-align: center; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
.puces { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; margin-top: 8px; }
.centre .puces { justify-content: center; }
.puce { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface-2); font-size: .9rem; }
.puce.ok { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.puce.attente { color: var(--muted); }
.puce.robot { color: var(--muted); border-style: dashed; }
button.petit { padding: 4px 8px; font-size: .85rem; }
button.danger { color: var(--alert); border-color: var(--alert); }
.soumis { border: 2px solid var(--ok); }
.onglets { margin-bottom: 14px; }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>La transition</h1>
      <div class="sub">Jeu 5 : la bourse du carbone</div>
    </div>
    <div class="muted small" id="etiquetteTour"></div>
  </header>
  <main id="app"><p class="muted">Connexion au jeu…</p></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Moteur du jeu « La transition » — logique pure, sans interface.
(function (root) {
  function defaultConfig(n) {
    return {
      nbEntreprises: n || 6, nbTours: 10,
      nbCheminees: 10, prodCheminee: 10, emissionUnite: 1, emissionResiduelle: 0.1,
      prixMax: 100, pente: 0.3, prixMin: 10,
      coutBase: 26, carburant: 14, elecParUnite: 18,
      coutsTransition: [200, 300, 400, 500, 700, 900, 1100, 1400, 1700, 2000],
      coutChemineeVerte: 1800, coutChemineePolluante: 1500, verteBase: 20, verteElec: 10,
      allocInitiale: 0.9, baisseAlloc: 0.08,
      venteGouvInitiale: 0.10, baisseVenteGouv: 0.01,
      prixPlancher: 10, haussePlancher: 0.10, prixReserve: 60,
      credit: 5000, taux: 0.05,
      prixElecBase: 0.7, referenceElecParEntreprise: 500, penteElec: 1,
      chocCentreDonnees: 0.2, aideFonds: 0.5, eolienHausse: 0.3, eolienDelai: 2,
      evenements: true, debutEvenements: 3, sequenceEvenements: {},
    };
  }
  // ---------- Événements ----------
  const EVENEMENTS = {
    activistes: { nom: "Des activistes achètent des droits", duree: 1,
      texte: (c, n) => `Un groupe d’activistes du climat achète à l’enchère jusqu’à ${10 * n} droits (l’équivalent de 10 t par entreprise), en offrant jusqu’à 25 % de plus que le dernier prix des droits, puis les retire du marché pour qu’ils ne servent jamais à polluer.`,
      effet: "Le prix des droits risque de monter : les entreprises qui ont des droits en trop peuvent les vendre plus cher." },
    cible: { nom: "Une nouvelle cible climatique", duree: 99,
      texte: () => "Le gouvernement resserre le plafond : chaque entreprise reçoit 10 droits gratuits de moins, pour le reste de la partie.",
      effet: "Ne rien faire coûtera encore plus cher." },
    fonds: { nom: "Le Fonds d’électrification", duree: 2,
      texte: (c) => `Le gouvernement finance ${Math.round(c.aideFonds * 100)} % du coût de transition des cheminées, grâce aux revenus de la bourse du carbone. L’aide s’applique aux conversions décidées ce tour-ci et au prochain.`,
      effet: "C’est le moment de convertir les cheminées les plus chères." },
    percee: { nom: "Une percée technologique", duree: 99,
      texte: () => "Une nouvelle technologie réduit de 30 % le coût de transition des cheminées 6 à 10, pour le reste de la partie.",
      effet: "Les dernières cheminées deviennent peut-être rentables." },
    secheresse: { nom: "Une faible hydraulicité", duree: 2,
      texte: () => "Une sécheresse vide en partie les réservoirs des barrages : la capacité de référence d’Hydro-Québec baisse de 25 %, ce tour-ci et le prochain.",
      effet: "L’électricité coûtera plus cher." },
    centre: { nom: "Un centre de données", duree: 2,
      texte: (c) => `Un grand centre de données se branche au réseau : il consomme l’équivalent de ${Math.round(c.chocCentreDonnees * 100)} % de la capacité de référence d’Hydro-Québec, ce tour-ci et le prochain.`,
      effet: "L’électricité coûtera plus cher." },
    petrole: { nom: "Une flambée du prix du pétrole", duree: 2,
      texte: (c) => `Le prix du carburant passe de ${c.carburant} $ à ${Math.round(c.carburant * 1.5)} $ par unité produite, ce tour-ci et le prochain.`,
      effet: "Les cheminées au carburant coûtent plus cher à faire fonctionner." },
    foret: { nom: "Un projet forestier", duree: 1,
      texte: (c, n) => `Un projet de plantation d’arbres génère des crédits compensatoires : le gouvernement ajoute ${10 * n} droits (l’équivalent de 10 t par entreprise) à son enchère, au prix plancher.`,
      effet: "Le prix des droits risque de baisser." },
    eolien: { nom: "Un parc éolien d’Hydro-Québec", duree: 99, condition: "La consommation a dépassé la capacité de référence au tour précédent.",
      texte: (c, n, t) => `Pour pallier le manque d’énergie, Hydro-Québec lance un projet de parc éolien. Il entrera en service au tour ${t + c.eolienDelai} et augmentera la capacité de référence de ${Math.round(c.eolienHausse * 100)} %, pour le reste de la partie.`,
      effet: "L’électricité coûtera moins cher une fois le parc en service : faut-il électrifier maintenant ?" },
    taux: { nom: "Une hausse des taux d’intérêt", duree: 99,
      texte: (c) => `La banque centrale relève ses taux : l’intérêt sur un solde négatif passe de ${Math.round(c.taux * 100)} % à ${Math.round(c.taux * 200)} % par tour, pour le reste de la partie.`,
      effet: "Les entreprises endettées paieront deux fois plus d’intérêts." },
    penurie: { nom: "Une pénurie d’équipements électriques", duree: 1,
      texte: () => "Les fournisseurs n’arrivent plus à livrer : les cheminées dont l’électrification est décidée ce tour-ci n’entreront en service que dans deux tours au lieu d’un.",
      effet: "Électrifier maintenant prendra plus de temps à rapporter." },
    aideVerte: { nom: "Un programme d’aide aux usines vertes", duree: 2,
      texte: () => "Le gouvernement paie 40 % du coût des cheminées vertes neuves construites ce tour-ci et au prochain.",
      effet: "Une occasion d’agrandir l’usine proprement, si les autres ne le font pas tous." },
    exportation: { nom: "Un contrat d’exportation d’électricité", duree: 99,
      texte: () => "Hydro-Québec signe un contrat pour vendre de l’électricité à un État voisin : la capacité de référence disponible pour les entreprises baisse de 15 %, pour le reste de la partie.",
      effet: "L’électricité coûtera plus cher." },
    ralentissement: { nom: "Un ralentissement économique", duree: 2,
      texte: () => "La demande baisse : le prix de vente maximal du produit diminue de 10 $, ce tour-ci et le prochain.",
      effet: "Les profits baissent : attention à la marge de crédit." },
  };
  const evenementEligible = (p, id) => id !== "eolien" || !!(p.dernier && p.dernier.demande > p.dernier.reference);
  // Tire l'événement d'un tour au moment où ce tour commence (les conditions dépendent de la partie).
  function tirerEvenement(p, t) {
    const c = p.config; if (!c.evenements || t < c.debutEvenements || t > c.nbTours) return;
    const seq = c.sequenceEvenements || {}, v = seq[t] || "hasard", deja = new Set(Object.values(p.plan));
    if (v === "aucun") return;
    if (EVENEMENTS[v] && !deja.has(v) && evenementEligible(p, v)) { p.plan[t] = v; return; }
    const reserves = new Set(Object.entries(seq).filter(([tt, id]) => +tt > t && EVENEMENTS[id]).map(([, id]) => id));
    const pool = Object.keys(EVENEMENTS).filter((k) => !deja.has(k) && !reserves.has(k) && k !== v && evenementEligible(p, k));
    if (pool.length) p.plan[t] = pool[Math.floor(p.aleaEv() * pool.length)];
  }
  const evenementDuTour = (p, t) => (p.plan || {})[t] || null;
  function evenementsActifs(p, t) { return Object.entries(p.plan || {}).filter(([t0, id]) => t >= +t0 && t < +t0 + EVENEMENTS[id].duree).map(([t0, id]) => ({ id, debut: +t0, enService: id !== "eolien" || t >= +t0 + p.config.eolienDelai })); }
  // Paramètres en vigueur à un tour donné, une fois les événements appliqués
  function configTour(p, t) {
    const c = p.config, n = p.entreprises.length;
    const ce = Object.assign({}, c, { allocDelta: 0, subvention: 0, percee: false, centreActif: false, activistes: null, foret: 0 });
    evenementsActifs(p, t).forEach(({ id, enService }) => {
      if (id === "eolien" && enService) ce.referenceElecParEntreprise *= 1 + c.eolienHausse;
      if (id === "exportation") ce.referenceElecParEntreprise *= 0.85;
      if (id === "taux") ce.taux = c.taux * 2;
      if (id === "penurie") ce.penurie = true;
      if (id === "aideVerte") ce.coutChemineeVerte = Math.round(c.coutChemineeVerte * 0.6);
      if (id === "petrole") ce.carburant = Math.round(c.carburant * 1.5);
      if (id === "ralentissement") ce.prixMax = c.prixMax - 10;
      if (id === "secheresse") ce.referenceElecParEntreprise *= 0.75;
      if (id === "centre") ce.centreActif = true;
      if (id === "cible") ce.allocDelta += 10;
      if (id === "fonds") ce.subvention = c.aideFonds;
      if (id === "percee") ce.percee = true;
      if (id === "activistes") ce.activistes = { q: 10 * n, prix: 45 };
      if (id === "foret") ce.foret = 10 * n;
    });
    return ce;
  }
  function rng(seed) { const o = { s: seed >>> 0 || 1 }; const f = () => { let s = o.s; s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; o.s = s; return (s % 100000) / 100000; }; f.etat = () => o.s; f.regler = (v) => { o.s = v >>> 0 || 1; }; return f; }

  function nouvellePartie(c, joueurs, seed) {
    const entreprises = joueurs.map((j, i) => ({
      id: i, nom: j.nom || "Entreprise " + (i + 1), humain: !!j.humain, strategie: j.strategie || "inactif",
      cheminees: Array.from({ length: c.nbCheminees }, (_, k) => ({ num: k + 1, type: "fossile", origine: "initiale" })),
      solde: 0, banque: 0, interetsTotal: 0, historique: [], attente: [],
    }));
    const p = { config: c, tour: 1, termine: false, alea: rng(seed || 12345), aleaEv: rng((seed || 12345) * 7 + 3), plan: {}, entreprises, dernier: null, journal: [], series: [] };
    tirerEvenement(p, 1);
    return p;
  }

  // ---------- Calculs ----------
  const coutTransitionBase = (c, ch) => c.coutsTransition[Math.min(ch.num, c.coutsTransition.length) - 1];
  const coutTransition = (c, ch) => Math.round(coutTransitionBase(c, ch) * (c.percee && ch.num >= 6 ? 0.7 : 1) * (1 - (c.subvention || 0)));
  const estNeuve = (c, ch) => ch.origine === "verte" && c.verteElec != null;
  const elecParUniteCh = (c, ch) => estNeuve(c, ch) ? c.verteElec : c.elecParUnite;
  const production = (c, e) => e.cheminees.length * c.prodCheminee;

  function barre(val, lim, lab, labLim) {

      <div class="etiquette"><span>${lab} : ${fmt(val)} sur ${fmt(lim)} (${labLim})</span></div></div>`;
  }

    return h;
  }
  function rendreMarches() {

    const conso = A.conso, ref = T.referenceElec(c, n);
    const dem = T.demandeElecTotale(partie, conso, t), pe = T.prixElecPour(c, dem, n);

      <div class="reseau-tete"><h2>État des marchés pour le tour ${t}</h2><span class="muted small">Bourse du carbone</span></div>

      </div>
      ${barre(emPrevues, plafond, "Émissions prévues", "droits gratuits et enchère du gouvernement")}

        <div class="ind fossil"><div class="val">${d && d.prixDroit != null ? fmt(d.prixDroit, 2) + " $/t" : "—"}</div><div class="lab">Prix des droits au dernier tour</div></div>
        ${c.activistes ? `<div class="ind"><div class="val">${fmt(c.activistes.q)} droits</div><div class="lab">Achetés par les activistes, s’ils en trouvent</div></div>` : ""}
      </div>
      <div class="reseau-tete" style="margin-top:16px"><h2>Hydro-Québec</h2><span class="muted small">Hydro-Québec produit toute l’électricité demandée, mais au-delà de la capacité de référence, chaque unité coûte plus cher.</span></div>

  function estimation(e, dec) {
    const n = partie.entreprises.length, t = partie.tour, c = T.configTour(partie, t), cs = T.configTour(partie, Math.min(t + 1, partie.config.nbTours));
    const A = agregats(), conso = A.conso, pe = T.prixElecPour(c, T.demandeElecTotale(partie, conso, t), n);
    const qTot = A.qTot, pv = T.prixVentePour(c, qTot, n);
    const em = T.emissions(c, e), gratuits = T.droitsGratuits(c, t), position = gratuits + e.banque - em, ref = prixRef();
    const carbone = position < 0 ? -position * Math.min(c.prixReserve, ref) : -position * ref * (t >= c.nbTours ? 0 : 0);
    const interets = e.solde < 0 ? -e.solde * c.taux : 0;

      if (ch.attente) return `<div class="ch choisie"><div class="etat">Électrification en cours</div><h3>Cheminée ${ch.num}<span class="muted small">${origine}</span></h3>
        <dl><dt>Émissions</dt><dd>${fmt(T.emCheminee(c, ch))} t par tour</dd><dt>En service</dt><dd>au tour ${ch.attente}</dd></dl><p class="small muted" style="margin:6px 0 0">Retardée par la pénurie d’équipements.</p></div>`;
      return `<div class="ch ${elec ? "electrifiee" : ""} ${choisi ? "choisie" : ""}">
        <div class="etat">${elec ? "Électrifiée" : choisi ? (c.penurie ? "En service au tour " + (t + 2) : "Électrifiée au prochain tour") : "Au carburant"}</div>
        <h3>Cheminée ${ch.num}<span class="muted small">${origine}</span></h3>
        <dl><dt>Émissions</dt><dd>${fmt(T.emCheminee(c, ch))} t par tour</dd>
        ${elec ? `<dt>Électricité</dt><dd>${fmt(c.prodCheminee * T.elecParUniteCh(c, ch))} unités</dd>` : `<dt>Coût de transition</dt><dd>${aide ? `<s class="muted">${argent(base)}</s> ` : ""}${argent(cout)}</dd>${aide ? `<dt></dt><dd class="small pos">grâce à : ${aide}</dd>` : ""}
          <dt>Gain estimé</dt><dd>${gain > 0 ? argent(gain) + " par tour" : "aucun aux prix actuels"}</dd>

  function rendreJournal() {

  function graphe(s, series, maxY, titre, legende) {

    if (!P || P.termine) return;
    const m = parseFloat(ui.minutes) || 0;
    await B.db.doc("game/state").update(clean({ status: "tour", tour: P.tour, endsAt: m > 0 ? Date.now() + m * 60000 : null, plan: P.plan, agg: agregatsP() }));
  }
  async function toutJouer() {
    if (P.entreprises.some((e) => e.humain)) return toast("Seulement pour une partie composée de robots.");
    while (P && !P.termine) { if (ST.status !== "tour") { await ouvrirTour(); ST.status = "tour"; ST.tour = P.tour; } await terminerTour(); ST.status = P.termine ? "fini" : "resolu"; }
  }
  async function archiver() {
    const res = P.entreprises.map((e, i) => ({ fid: P.fids[i], nom: e.nom, humain: e.humain, strategie: e.humain ? null : e.strategie, solde: Math.round(e.solde), nbElec: T.nbElec(e), interets: Math.round(e.interetsTotal) })).sort((a, b) => b.solde - a.solde);
    await B.db.doc("archive/" + P.session).set(clean({ nom: P.nom || "", date: P.date || Date.now(), nbTours: P.config.nbTours, toursJoues: P.series.length, n: P.entreprises.length, resultats: res }));
  }
  async function renommer(fid, nom) {
    nom = (nom || "").trim().slice(0, 40); if (!nom) return toast("Le nom ne peut pas être vide.");
    await B.db.doc("firms/" + fid).update({ nom });
    if (P) { const i = P.fids.indexOf(fid); if (i >= 0) { P.entreprises[i].nom = nom; await B.db.doc("etat/" + P.session + "_f" + i).set(clean({ session: P.session, i, fid, e: P.entreprises[i] })); await publierPrives(); } }
    delete ui.noms[fid];
  }
  function nomNeutre(fid) { const l = FIRMS.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)); return "Entreprise " + (l.findIndex((f) => f.id === fid) + 1); }
  async function tousNeutres() { for (const f of FIRMS) await renommer(f.id, nomNeutre(f.id)); toast("Tous les noms sont maintenant neutres."); }
  async function retirer(fid) { await B.db.doc("firms/" + fid).delete(); if (ROBOTS[fid]) { const m = Object.assign({}, ROBOTS); delete m[fid]; await B.db.doc("etat/" + ST.session + "_robots").set({ session: ST.session, map: m }); } }
  async function confierRobot(fid, strat) {
    const i = P.fids.indexOf(fid); if (i < 0) return;
    P.entreprises[i].humain = false; P.entreprises[i].strategie = strat; P.owners[fid] = null;
    await B.db.doc("firms/" + fid).update({ kind: "robot", owner: null });
    await sauverP(); toast(P.entreprises[i].nom + " est maintenant gérée par un robot.");
  }
  async function donnerA(fid, fidEtudiant) {
    const i = P.fids.indexOf(fid), f = FIRMS.find((x) => x.id === fidEtudiant); if (i < 0 || !f) return;
    P.entreprises[i].humain = true; P.entreprises[i].nom = f.nom; P.owners[fid] = f.owner;
    await B.db.doc("firms/" + fid).update({ kind: "humain", owner: f.owner, nom: f.nom });
    await B.db.doc("firms/" + fidEtudiant).delete();
    await sauverP(); await publierPrives(); toast(f.nom + " dirige maintenant l’entreprise.");
  }
  async function basculerSoldes(v) { await B.db.doc("game/state").update(clean({ showSoldes: v, soldes: v && P ? soldesMap() : (P && P.termine ? soldesMap() : null) })); }
  async function majConfig(cle, valeur) { const c = Object.assign({}, ST.config); c[cle] = valeur; await B.db.doc("game/state").update(clean({ config: c })); }

  // ---------- Exportation, suppression, noms neutres (historique) ----------
  async function chargerEtat(S) {
    if (P && P.session === S) return P;
    const g = await B.db.doc("etat/" + S + "_global").get(); if (!g.exists) return null;
    const q = await B.db.collection("etat").where("session", "==", S).get();
    return Object.assign({}, g.data(), { entreprises: q.docs.map((d) => d.data()).filter((x) => x.e).sort((a, b) => a.i - b.i).map((x) => x.e) });
  }
  async function exporterCSV(S) {
    const p = await chargerEtat(S); if (!p || !p.entreprises.length) return toast("Aucune donnée à exporter pour cette partie.");
    const n = (x) => x == null ? "" : String(Math.round(x * 100) / 100).replace(".", ","), q = (x) => '"' + String(x ?? "").replace(/"/g, '""') + '"';
    const date = p.date ? new Date(p.date).toLocaleDateString("fr-CA") : "";
    const tete = ["Partie", "Date", "Tour", "Entreprise", "Type", "Stratégie du robot", "Tour forcé", "Cheminées électrifiées ce tour", "Cheminées vertes ajoutées", "Cheminées polluantes ajoutées", "Prix offert à la bourse ($/t)", "Stratégie écrite", "Confiance (1 à 5)", "Production", "Émissions (t)", "Droits gratuits", "Droits en réserve au début", "Droits achetés à la bourse", "Droits achetés à la réserve", "Droits vendus", "Droits gardés", "Revenus", "Coûts de production", "Carbone net", "Investissements", "Intérêts", "Profit du tour", "Solde"];
    const lignes = [tete.map(q).join(";")];
    p.entreprises.forEach((e) => e.historique.forEach((l) => {
      const d = l.decide || {};
      lignes.push([p.nom || "", date, l.tour || "", e.nom, e.humain ? "Étudiant·e" : "Robot", e.humain ? "" : ((T.STRATEGIES[e.strategie] || {}).nom || ""), l.force ? "oui" : "non", (d.electrifier || []).join(" "), d.vertes || 0, d.polluantes || 0, n(l.prixOrdre), l.texteStrategie || "", l.confiance || "",
        n(l.quantite), n(l.emissions), n(l.gratuits), n(l.banqueDebut), n(l.achetes), n(l.reserve), n(l.vendus), n(l.banqueFin), n(l.revenus), n(l.coutsProduction), n(l.carbone), n(l.investissement), n(l.interets), n(l.profit), n(l.solde)].map(q).join(";"));
    }));
    await B.save("transition-" + (p.nom || "partie").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase() + ".csv", "\ufeff" + lignes.join("\r\n"));
  }
  async function supprimerPartie(S) {
    if (ST && ST.session === S) return toast("C’est la partie en cours : crée d’abord une nouvelle partie.");
    for (const col of ["firms", "rounds", "decisions", "priv", "etat"]) { const qq = await B.db.collection(col).where("session", "==", S).get(); for (const d of qq.docs) await B.db.doc(col + "/" + d.id).delete(); }
    await B.db.doc("archive/" + S).delete(); toast("Partie et données supprimées.");
  }
  async function neutraliserArchive(S) {
    const a = ARCH.find((x) => x.id === S); if (!a) return;
    const res = (a.resultats || []).map((r, k) => Object.assign({}, r, { nom: r.humain ? "Entreprise " + (k + 1) : r.nom }));
    await B.db.doc("archive/" + S).update(clean({ resultats: res }));
    const qq = await B.db.collection("etat").where("session", "==", S).get();
    for (const d of qq.docs) { const x = d.data(); if (x.e && x.e.humain) { const r = res.find((y) => y.fid === x.fid); if (r) { x.e.nom = r.nom; await B.db.doc("etat/" + d.id).set(clean(x)); } } }
    toast("Noms neutres enregistrés pour cette partie.");
  }

  // ---------- Vue reconstruite pour un joueur ou pour la projection ----------
  function construireVue(moi) {
    const fids = ST.fids || [], nomDe = (fid) => (FIRMS.find((f) => f.id === fid) || {}).nom || "Entreprise";
    const rounds = ROUNDS.filter((r) => r.session === ST.session).sort((a, b) => a.tour - b.tour);
    const hist = fids.map(() => []); rounds.forEach((r) => (r.lignes || []).forEach((l) => { if (hist[l.id]) hist[l.id].push(l); }));
    if (moi != null && PRIV) hist[moi] = PRIV.historique || [];
    const ents = fids.map((fid, i) => ({ id: i, nom: nomDe(fid), humain: i === moi, strategie: ST.revele ? ST.revele[fid] : null,
      cheminees: i === moi && PRIV ? PRIV.cheminees : [], solde: i === moi && PRIV ? PRIV.solde : 0, banque: i === moi && PRIV ? PRIV.banque : 0,
      interetsTotal: i === moi && PRIV ? PRIV.interetsTotal : 0, historique: hist[i] }));
    const der = rounds[rounds.length - 1];
    const dernier = der ? Object.assign({}, der.marche, { tour: der.tour, lignes: (der.lignes || []).map((l) => (moi != null && l.id === moi && PRIV && PRIV.historique && PRIV.historique[der.tour - 1]) ? PRIV.historique[der.tour - 1] : l) }) : null;
    const soldes = ST.soldes ? Object.fromEntries(fids.map((f, i) => [i, ST.soldes[f]])) : null;
    return { vue: moi != null ? "joueur" : "projection", config: ST.config, tour: ST.status === "tour" ? ST.tour : (ST.tour || 0) + 1, termine: ST.status === "fini", plan: ST.plan || {}, agg: ST.agg,
      dernier, series: rounds.map((r) => r.serie), journal: rounds.map((r) => ({ tour: r.tour, evenements: r.evenements || [] })), entreprises: ents, soldes: ST.showSoldes || ST.status === "fini" ? soldes : null };
  }

  // ---------- Vue joueur ----------
  function rendreJoueur() {
    if (!ST) { entete(""); app.innerHTML = `<section class="card centre"><h2>Le jeu n’est pas encore ouvert</h2><p class="muted">Garde cette page ouverte : elle s’actualisera toute seule.</p></section>`; return; }
    const mienne = FIRMS.find((f) => f.id === B.uid || f.owner === B.uid);
    const formulaire = (tard) => `<section class="card centre" style="max-width:520px;margin:30px auto"><h2>Rejoindre la partie${ST.nom ? " : " + esc(ST.nom) : ""}</h2>
      <p class="muted">Choisis le nom de ton entreprise. ${tard ? "La partie est commencée : ton enseignant te confiera une entreprise." : "Il sera visible par les autres joueurs."}</p>
      <div class="ligne" style="justify-content:center;margin-top:10px"><input type="text" id="nomEntreprise" maxlength="40" style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);min-width:240px" aria-label="Nom de ton entreprise"><button class="primary" data-act="rejoindre">Rejoindre</button></div></section>`;
    if (ST.status === "lobby") {
      entete(ST.nom || "Inscription");
      app.innerHTML = mienne ? `<section class="card centre" style="max-width:560px;margin:30px auto"><h2>${esc(mienne.nom)}</h2><p class="muted">Ton entreprise est inscrite. La partie va bientôt commencer : garde cette page ouverte.</p><p class="small muted">${FIRMS.length} entreprise${FIRMS.length > 1 ? "s" : ""} inscrite${FIRMS.length > 1 ? "s" : ""}.</p></section>` : formulaire(false);
      return;
    }
    const moi = PRIV && PRIV.session === ST.session ? (ST.fids || []).indexOf(PRIV.fid) : -1;
    if (moi < 0) {
      entete(ST.nom || "Partie en cours");
      app.innerHTML = mienne ? `<section class="card centre" style="max-width:560px;margin:30px auto"><h2>${esc(mienne.nom)}</h2><p class="muted">La partie est commencée. Ton enseignant va te confier une entreprise : garde cette page ouverte.</p></section>` : formulaire(true);
      return;
    }
    const maFirme = FIRMS.find((x) => x.id === PRIV.fid);
    if (maFirme && maFirme.owner !== B.uid) {
      entete(ST.nom || "Partie en cours");
      app.innerHTML = `<section class="card centre" style="max-width:560px;margin:30px auto"><h2>${esc(PRIV.nom || "Ton entreprise")}</h2><p class="muted">Ton entreprise est maintenant gérée par un robot. Parle à ton enseignant si tu veux reprendre la partie.</p></section>`;
      return;
    }
    partie = construireVue(moi); onglet = moi;
    if (ui.draftTour !== partie.tour) { ui.draftTour = partie.tour; decisions[moi] = decisionVide(decisions[moi]); ui.arme = null; }
    const soumis = ST.status === "tour" && MYDEC && MYDEC.session === ST.session && MYDEC.tour === ST.tour;
    entete((ST.nom ? ST.nom + " · " : "") + (partie.termine ? "Partie terminée" : ST.status === "tour" ? "Tour " + ST.tour + " sur " + partie.config.nbTours : "Tour " + ST.tour + " terminé") + minuterie());
    let milieu = "";
    if (partie.termine) milieu = rendreFinJoueur(moi);
    else if (ST.status === "resolu") milieu = `<section class="card" style="margin-top:16px"><h2>En attente du tour ${ST.tour + 1}</h2><p class="muted" style="margin:0">Lis ton bilan. Ton enseignant ouvrira bientôt le prochain tour.</p></section>`;
    else if (soumis) milieu = rendreSoumis(MYDEC);
    else milieu = rendreMarches() + rendreDecisions([partie.entreprises[moi]]);
    app.innerHTML = `${partie.termine ? milieu : ""}${rendreBilan([partie.entreprises[moi]])}${partie.termine ? "" : milieu}${rendreGraphiques()}${rendreJournal()}`;
    lierJoueur();
  }
  function rendreSoumis(d) {
    const c = partie.config;
    return `<section class="card soumis" style="margin-top:16px"><h2>Ta décision du tour ${d.tour} est soumise</h2>
      <p>${esc(decisionsTexte({ decide: d }))}${(d.electrifier || []).length || d.vertes || d.polluantes ? "" : ""}. ${d.garderDroits ? "Tu gardes tes droits en trop." : "Prix à la bourse : " + fmt(d.prixAchat) + " $ à l’achat ou " + fmt(d.prixVente) + " $ à la vente, selon ta position."}</p>
      <div class="note"><b>Ta stratégie :</b> « ${esc(d.texteStrategie)} » <span style="color:var(--fossil)">${etoiles(d.confiance)}</span></div>
      <p class="muted small" style="margin-top:8px">Une décision soumise ne peut plus être modifiée. Les résultats apparaîtront quand ton enseignant terminera le tour${c ? "" : ""}.</p></section>`;
  }
  function rendreFinJoueur(moi) {
    const e = partie.entreprises[moi];
    return `<section class="card" style="margin-bottom:16px"><h2>Partie terminée</h2>
      <div class="estim" style="margin-top:8px"><div>Ton solde final<b class="${e.solde < 0 ? "neg" : ""}">${argent(e.solde)}</b></div><div>Cheminées électrifiées<b>${(e.cheminees || []).filter((c) => c.type === "elec").length} sur ${(e.cheminees || []).length}</b></div><div>Intérêts payés<b>${argent(e.interetsTotal)}</b></div></div>
      <div class="actions"><button class="primary" data-act="dossier">Télécharger mon dossier</button><span class="muted small">Garde-le : il te servira pour l’évaluation. Le classement est présenté par ton enseignant.</span></div></section>
      ${tableauStrategies(e)}`;
  }
  function tableauStrategies(e) {
    return `<section class="card" style="margin-bottom:16px"><h2>Tes stratégies, tour par tour</h2>
      <div class="table-wrap"><table><thead><tr><th>Tour</th><th style="text-align:left">Décisions</th><th style="text-align:left">Stratégie</th><th>Confiance</th><th>Émis. (t)</th><th>Profit du tour</th><th>Solde</th></tr></thead><tbody>
      ${e.historique.map((l, k) => `<tr><td>${k + 1}</td><td style="text-align:left;white-space:normal">${esc(decisionsTexte(l))}</td><td style="text-align:left;white-space:normal">${esc(l.texteStrategie || "—")}</td><td style="color:var(--fossil)">${l.confiance ? etoiles(l.confiance) : "—"}</td><td>${fmt(l.emissions)}</td><td class="${l.profit < 0 ? "neg" : ""}">${argent(l.profit)}</td><td class="${l.solde < 0 ? "neg" : ""}">${argent(l.solde)}</td></tr>`).join("")}
      </tbody></table></div><p class="small muted" style="margin-top:8px">Ta confiance était-elle justifiée ? Repère les tours où elle était forte mais où le résultat a déçu, et demande-toi ce que tu n’avais pas prévu.</p></section>`;
  }
  async function telechargerDossier() {
    const moi = onglet, e = partie.entreprises[moi], css = document.querySelector("style").textContent;
    const html = `<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><title>Dossier : ${esc(e.nom)}</title><style>${css}</style></head><body><div class="wrap">
      <h1>La transition : dossier de ${esc(e.nom)}</h1><p class="muted">${esc(ST.nom || "")}${ST.date ? ", " + new Date(ST.date).toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" }) : ""}. Solde final : ${argent(e.solde)}.</p>
      ${tableauStrategies(e)}${rendreGraphiques()}${rendreJournal()}</div></body></html>`;
    await B.save("dossier-transition-" + e.nom.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase() + ".html", html);

  async function rejoindre() {
    const nom = (($("#nomEntreprise") || {}).value || "").trim().slice(0, 40);
    if (!nom) return toast("Écris le nom de ton entreprise.");
    await B.db.doc("firms/" + B.uid).set({ session: ST.session, nom, owner: B.uid, kind: "humain", ts: Date.now() });
  }
  async function soumettre() {
    const dec = decisions[onglet];
    if (!strategieComplete(dec)) return toast("Écris ta stratégie et choisis ta confiance.");
    const c = T.configTour(partie, partie.tour), e = partie.entreprises[onglet];
    if (T.coutInvestissement(c, e, dec) > T.margeDisponible(c, e)) return toast("Tes investissements dépassent ta marge de crédit.");
    if (!armer("soumettre", 6000)) return;
    await B.db.doc("decisions/" + B.uid).set(clean({ session: ST.session, tour: ST.tour, fid: PRIV.fid, by: B.uid, electrifier: dec.electrifier.slice(), vertes: dec.vertes, polluantes: dec.polluantes,
      prixAchat: dec.prixAchat, prixVente: dec.prixVente, garderDroits: !!dec.garderDroits, texteStrategie: dec.texteStrategie.trim().slice(0, 500), confiance: dec.confiance, ts: Date.now() }));
    toast("Décision soumise.");
  }

  // ---------- Vue projetée ----------
  function rendreProjection() {
    if (!ST) { entete(""); app.innerHTML = `<section class="card centre"><h2>Aucune partie</h2></section>`; return; }
    if (ST.status === "lobby") {
      entete(ST.nom || "Inscription");
      app.innerHTML = `<section class="card centre"><h2>${esc(ST.nom || "La transition")}</h2><p class="muted">Inscriptions en cours : ${FIRMS.length} entreprise${FIRMS.length > 1 ? "s" : ""}.</p>
        <div class="puces">${FIRMS.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).map((f) => `<span class="puce">${esc(f.nom)}</span>`).join("")}</div></section>`;
      return;
    }
    partie = construireVue(null);
    entete((ST.nom ? ST.nom + " · " : "") + (partie.termine ? "Partie terminée" : ST.status === "tour" ? "Tour " + ST.tour + " sur " + partie.config.nbTours : "Tour " + ST.tour + " terminé") + minuterie());

      const nbOk = fids.filter((f) => etat(f) !== "attente").length;

        ${B.isOwner ? `<div class="puces" style="margin-top:8px">${fids.map((f) => `<span class="puce ${etat(f)}">${etat(f) === "ok" ? "✓ " : etat(f) === "robot" ? "⚙ " : ""}${esc((FIRMS.find((x) => x.id === f) || {}).nom || "")}</span>`).join("")}</div>` : ""}
        ${banniereEvenement()}</section>`;

  }
  function classementProjection() {

  }

  // ---------- Vue de l'enseignant ----------
  const TABS = [["partie", "Partie"], ["entreprises", "Entreprises"], ["parametres", "Paramètres"], ["historique", "Historique"]];
  function rendreAdmin() {
    entete((ST && ST.nom ? ST.nom + " · " : "") + (!ST ? "Administration" : ST.status === "lobby" ? "Inscriptions" : ST.status === "fini" ? "Partie terminée" : ST.status === "tour" ? "Tour " + ST.tour + " en cours" : "Tour " + ST.tour + " terminé") + minuterie());

  function adminPartie() {
    if (!ST) return `<section class="card"><h2>Créer une partie</h2><p class="muted">Donne-lui un nom, par exemple le groupe. Les étudiant·es pourront ensuite s’inscrire avec le lien du jeu.</p>
      <div class="ligne" style="margin-top:8px"><input type="text" id="nomPartie" maxlength="60" value="${esc(ui.nomPartie)}" placeholder="Groupe 00001" style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);min-width:240px"><button class="primary" data-act="creer">Créer la partie</button></div></section>`;
    const c = ST.config, fini = ST.status === "fini";
    const minInput = `<label class="small">Minuterie (min, 0 = aucune) <input type="number" id="minutes" min="0" max="30" step="0.5" value="${esc(ui.minutes)}" style="width:5.5em"></label>`;
    let ctrl = "";
    if (ST.status === "lobby") ctrl = `<p>${FIRMS.length} entreprise${FIRMS.length > 1 ? "s" : ""} inscrite${FIRMS.length > 1 ? "s" : ""}, dont ${FIRMS.filter((f) => f.kind === "robot").length} robot${FIRMS.filter((f) => f.kind === "robot").length > 1 ? "s" : ""}. Vérifie les noms dans l’onglet Entreprises.</p>
      <div class="actions">${minInput}<button class="primary" data-act="commencer" ${FIRMS.length < 2 ? "disabled" : ""}>Commencer la partie (tour 1)</button></div>`;
    else if (!P) ctrl = `<p class="muted">Chargement de la partie…</p>`;
    else if (ST.status === "tour") {
      const humains = P.entreprises.map((e, i) => ({ e, fid: P.fids[i] })).filter((x) => x.e.humain);
      const ok = humains.filter((x) => DECS.some((d) => d.fid === x.fid && d.session === ST.session && d.tour === ST.tour));
      ctrl = `<p><b>${ok.length} décision${ok.length > 1 ? "s" : ""} reçue${ok.length > 1 ? "s" : ""} sur ${humains.length}</b>${humains.length - ok.length ? ". En attente : " + humains.filter((x) => !ok.includes(x)).map((x) => esc(x.e.nom)).join(", ") : ""}.</p>
        <div class="actions"><button class="primary" data-act="terminer">${humains.length - ok.length ? "Forcer la fin du tour " + ST.tour : "Terminer le tour " + ST.tour}</button>
        ${ST.endsAt ? `<button data-act="plus1">+ 1 min</button><button data-act="stop">Arrêter la minuterie</button>` : ""}${humains.length ? "" : `<button data-act="toutjouer">Jouer jusqu’à la fin</button>`}</div>
        <p class="muted small">Les entreprises qui n’ont pas soumis reçoivent la décision forcée : aucun investissement, prix de ${c.prixReserve} $ à l’achat ou à la vente, la stratégie « ${FORCE_TEXTE} » et une confiance de 1 étoile. Garde cette page ouverte : c’est elle qui calcule les tours.</p>`;
    } else if (ST.status === "resolu") ctrl = `<div class="actions">${minInput}<button class="primary" data-act="ouvrir">Ouvrir le tour ${P.tour}</button>${P.entreprises.some((e) => e.humain) ? "" : `<button data-act="toutjouer">Jouer jusqu’à la fin</button>`}</div>`;
    else ctrl = `<p>La partie est terminée et archivée.</p>`;
    let h = `<section class="card"><div class="ligne" style="justify-content:space-between;align-items:flex-start"><div>
        <label class="small muted">Nom de la partie <input type="text" id="nomPartieActuelle" maxlength="60" value="${esc(ui.nomPartieEdit != null ? ui.nomPartieEdit : ST.nom || "")}" style="display:block;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:240px;margin-top:3px"></label>
        <p class="small muted" style="margin:6px 0 0">${ST.date ? "Partie jouée le " + new Date(ST.date).toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" }) + ". " : ""}${c.nbTours} tours.</p></div>
        <div class="actions" style="margin-top:0"><label class="coche" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showSoldes" ${ST.showSoldes ? "checked" : ""} ${ST.status === "lobby" ? "disabled" : ""}> Afficher les soldes sur la projection</label>
        ${ST.status !== "lobby" ? `<button data-act="export" data-s="${ST.session}">Exporter en CSV</button>` : ""}</div></div>
      ${ctrl}
      <p class="small muted" style="margin-top:10px">Projection : ajoute <b>#affichage</b> à la fin du lien de cette page et ouvre-la sur l’ordinateur relié au projecteur.</p>
      <div class="ligne" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><input type="text" id="nomPartie" maxlength="60" value="${esc(ui.nomPartie)}" placeholder="Nom de la prochaine partie" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)">${btnArme("nouvelle", "Nouvelle partie", "Confirmer : archiver celle-ci et en créer une nouvelle")}</div></section>`;
    if (P && ST.status !== "lobby") {
      partie = Object.assign(P, { vue: "admin", agg: null, soldes: null });
      h += `${fini ? classementAdmin() : ""}${rendreBilan([])}${!fini && ST.status === "tour" ? rendreMarches() : ""}${rendreGraphiques()}${rendreJournal()}`;
    }
    return h;
  }
  function classementAdmin() {
    const l = P.entreprises.map((e, i) => ({ e, i })).sort((a, b) => b.e.solde - a.e.solde);
    return `<section class="card" style="margin:16px 0"><h2>Classement final</h2><div class="table-wrap"><table><thead><tr><th>Rang</th><th>Entreprise</th><th>Type</th><th>Cheminées électrifiées</th><th>Intérêts payés</th><th>Solde final</th></tr></thead><tbody>
      ${l.map((x, k) => `<tr><td>${k + 1}</td><td>${esc(x.e.nom)}</td><td>${x.e.humain ? "Étudiant·e" : "Robot : " + esc((T.STRATEGIES[x.e.strategie] || {}).nom || "")}</td><td>${T.nbElec(x.e)} sur ${x.e.cheminees.length}</td><td>${argent(x.e.interetsTotal)}</td><td class="${x.e.solde < 0 ? "neg" : ""}"><strong>${argent(x.e.solde)}</strong></td></tr>`).join("")}</tbody></table></div></section>`;
  }
  function adminEntreprises() {
    if (!ST) return `<section class="card"><p class="muted">Crée d’abord une partie.</p></section>`;
    const lobby = ST.status === "lobby", stratOpts = (v) => STRATS.map((s) => `<option value="${s}" ${v === s ? "selected" : ""}>${T.STRATEGIES[s].nom}</option>`).join("");
    const enJeu = !lobby && P ? P.fids : null;
    const liste = enJeu ? enJeu.map((fid, i) => ({ fid, e: P.entreprises[i], f: FIRMS.find((x) => x.id === fid) || {} })) : FIRMS.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).map((f) => ({ fid: f.id, e: null, f }));
    const attente = enJeu ? FIRMS.filter((f) => f.kind === "humain" && !enJeu.includes(f.id)) : [];
    const lignes = liste.map(({ fid, e, f }) => {
      const humain = e ? e.humain : f.kind === "humain", nom = e ? e.nom : f.nom;
      const etat = !e || ST.status !== "tour" ? "" : !humain ? "Robot" : DECS.some((d) => d.fid === fid && d.session === ST.session && d.tour === ST.tour) ? "✓ Soumise" : "En attente";
      let actions = "";
      if (lobby) actions = btnArme("retirer:" + fid, "Retirer", "Confirmer le retrait", "petit");
      else if (e && humain) actions = `<select id="conf-${fid}" data-conf="${fid}" aria-label="Stratégie du robot">${stratOpts(ui.confier[fid] || "calculateur")}</select>${btnArme("confier:" + fid, "Confier à un robot", "Confirmer", "petit")}`;
      else if (e && !humain && attente.length) actions = `<select id="don-${fid}" data-don="${fid}" aria-label="Étudiant·e"><option value="">Choisir un·e étudiant·e</option>${attente.map((a) => `<option value="${a.id}" ${ui.donner[fid] === a.id ? "selected" : ""}>${esc(a.nom)}</option>`).join("")}</select><button class="petit" data-act="donner:${fid}">Donner le contrôle</button>`;
      return `<tr><td><div class="ligne" style="flex-wrap:nowrap;gap:6px"><input type="text" id="nom-${fid}" data-nom="${fid}" maxlength="40" value="${esc(ui.noms[fid] != null ? ui.noms[fid] : nom)}" style="border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);width:12em"><button class="petit" data-act="renommer:${fid}">Enregistrer</button><button class="petit" data-act="neutre:${fid}">Nom neutre</button></div></td>
        <td>${humain ? "Étudiant·e" : "Robot : " + esc((T.STRATEGIES[e ? e.strategie : ROBOTS[fid]] || {}).nom || "")}</td><td>${etat}</td><td><div class="ligne" style="gap:6px">${actions}</div></td></tr>`;
    }).join("");
    return `<section class="card"><div class="ligne" style="justify-content:space-between"><h2>Entreprises</h2>${btnArme("tousneutres", "Rendre tous les noms neutres", "Confirmer : tous les noms neutres")}</div>
      <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th style="text-align:left">Nom</th><th>Type</th><th>Tour en cours</th><th>Actions</th></tr></thead><tbody>${lignes || `<tr><td colspan="4" class="muted">Aucune entreprise pour l’instant.</td></tr>`}</tbody></table></div>
      ${lobby ? `<div class="bloc"><h3>Ajouter un robot</h3><div class="ligne"><input type="text" id="robotNom" maxlength="40" value="${esc(ui.robotNom)}" placeholder="Nom du robot" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)"><select id="robotStrat" aria-label="Stratégie du robot">${stratOpts(ui.robotStrat)}</select><button class="primary" data-act="robot">Ajouter</button></div>
        <p class="muted small">${STRATS.map((s) => "<b>" + T.STRATEGIES[s].nom + "</b> : " + T.STRATEGIES[s].desc).join(" ")}</p></div>` : ""}
      ${attente.length ? `<div class="bloc"><h3>Étudiant·es en attente d’une entreprise</h3><p>${attente.map((a) => esc(a.nom)).join(", ")}</p><p class="muted small">Donne-leur le contrôle d’une entreprise gérée par un robot, dans le tableau ci-dessus. Ils reprennent son historique.</p></div>` : ""}</section>`;
  }
  function adminParametres() {
    if (!ST) return `<section class="card"><p class="muted">Crée d’abord une partie.</p></section>`;
    const c = ST.config, lobby = ST.status === "lobby", dis = lobby ? "" : "disabled";
    const seq = c.sequenceEvenements || {}, opts = (v) => `<option value="hasard" ${!v || v === "hasard" ? "selected" : ""}>Au hasard</option><option value="aucun" ${v === "aucun" ? "selected" : ""}>Aucun événement</option>` + Object.keys(T.EVENEMENTS).map((k) => `<option value="${k}" ${v === k ? "selected" : ""}>${T.EVENEMENTS[k].nom}${T.EVENEMENTS[k].condition ? " (sous condition)" : ""}</option>`).join("");
    const rows = []; for (let t = c.debutEvenements; t <= c.nbTours; t++) rows.push(`<label>Tour ${t}<select data-seq="${t}" ${dis}>${opts(seq[t])}</select></label>`);
    return `<section class="card"><h2>Paramètres de la partie</h2>${lobby ? "" : `<p class="note">La partie est commencée : les paramètres ne peuvent plus être modifiés.</p>`}
      <div class="ligne" style="margin-top:8px"><label>Nombre de tours (suggéré : 10) <input type="number" data-param="nbTours" min="4" max="14" value="${c.nbTours}" ${dis}></label></div>
      <div class="bloc"><h3>Événements</h3><label class="coche" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-param="evenements" ${c.evenements ? "checked" : ""} ${dis}> Un événement par tour à partir du tour ${c.debutEvenements}, annoncé au début du tour</label>
        <div class="params" style="margin-top:8px">${rows.join("")}</div>
        <p class="muted small">Le parc éolien n’arrive que si la consommation d’électricité a dépassé la capacité de référence au tour précédent.</p></div>
      <div class="bloc"><h3>Équilibrage</h3><div class="params">${PARAMS.map(([k, lab]) => `<label>${lab}<input type="number" step="any" data-param="${k}" value="${c[k]}" ${dis}></label>`).join("")}</div>
        <label class="small muted" style="display:block;margin-top:10px">Coûts de transition des cheminées 1 à 10 ($, séparés par des virgules)<input type="text" data-param="coutsTransition" value="${c.coutsTransition.join(", ")}" ${dis} style="display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)"></label></div></section>`;
  }
  function adminHistorique() {
    if (!ARCH.length) return `<section class="card"><p class="muted">Aucune partie terminée pour l’instant. Une partie est archivée à la fin de son dernier tour ou quand tu en crées une nouvelle.</p></section>`;
    return `<p class="muted small">Les données de chaque partie (décisions, stratégies, résultats) sont conservées jusqu’à ce que tu supprimes la partie. Pour la Loi 25, rends les noms neutres ou supprime la partie quand tu n’en as plus besoin.</p>` +
      ARCH.slice().sort((a, b) => (b.date || 0) - (a.date || 0)).map((a) => `<section class="card" style="margin-bottom:12px"><div class="ligne" style="justify-content:space-between"><div><h3>${esc(a.nom || "Partie sans nom")}</h3><p class="small muted" style="margin:2px 0 0">${a.date ? new Date(a.date).toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" }) + ", " : ""}${a.toursJoues} tour${a.toursJoues > 1 ? "s" : ""}, ${a.n} entreprises</p></div>
        <div class="ligne" style="gap:6px"><button class="petit" data-act="export" data-s="${a.id}">Exporter en CSV</button>${btnArme("neutarch:" + a.id, "Rendre les noms neutres", "Confirmer", "petit")}${btnArme("suppr:" + a.id, "Supprimer la partie", "Confirmer : tout supprimer", "petit danger")}</div></div>
        <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Rang</th><th>Entreprise</th><th>Type</th><th>Électrifiées</th><th>Solde</th></tr></thead><tbody>${(a.resultats || []).map((r, k) => `<tr><td>${k + 1}</td><td>${esc(r.nom)}</td><td>${r.humain ? "Étudiant·e" : "Robot : " + esc((T.STRATEGIES[r.strategie] || {}).nom || "")}</td><td>${r.nbElec}</td><td class="${r.solde < 0 ? "neg" : ""}">${argent(r.solde)}</td></tr>`).join("")}</tbody></table></div></section>`).join("");
  }

  // ---------- Interactions ----------
  async function onClick(ev) {
    const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act;
    try {
      if (a === "tab") { ui.tab = b.dataset.t; ui.arme = null; render(); return; }
      if (a === "logout") { B.logout(); return; }
      if (a === "rejoindre") return await rejoindre();
      if (a === "soumettre") return await soumettre();
      if (a === "dossier") return await telechargerDossier();
      if (a === "creer") return await creerPartie();
      if (a === "nouvelle") { if (armer("nouvelle")) await creerPartie(); return; }
      if (a === "commencer") return await commencer();
      if (a === "terminer") return await terminerTour();
      if (a === "ouvrir") return await ouvrirTour();
      if (a === "toutjouer") return await toutJouer();
      if (a === "plus1") return await B.db.doc("game/state").update({ endsAt: Math.max(Date.now(), ST.endsAt || Date.now()) + 60000 });
      if (a === "stop") return await B.db.doc("game/state").update({ endsAt: null });
      if (a === "robot") return await ajouterRobot();
      if (a === "export") return await exporterCSV(b.dataset.s);
      if (a === "tousneutres") { if (armer("tousneutres")) await tousNeutres(); return; }
      const [cmd, arg] = a.split(":");
      if (cmd === "renommer") { const i = document.getElementById("nom-" + arg); return await renommer(arg, i ? i.value : ""); }
      if (cmd === "neutre") return await renommer(arg, nomNeutre(arg));
      if (cmd === "retirer") { if (armer(a)) await retirer(arg); return; }
      if (cmd === "confier") { if (armer(a)) await confierRobot(arg, ui.confier[arg] || "calculateur"); return; }
      if (cmd === "donner") { if (!ui.donner[arg]) return toast("Choisis d’abord un·e étudiant·e."); return await donnerA(arg, ui.donner[arg]); }
      if (cmd === "neutarch") { if (armer(a)) await neutraliserArchive(arg); return; }
      if (cmd === "suppr") { if (armer(a)) await supprimerPartie(arg); return; }
    } catch (e) { err(e); }
  }
  async function onChange(ev) {
    const t = ev.target;
    try {
      if (t.id === "showSoldes") return await basculerSoldes(t.checked);
      if (t.id === "nomPartieActuelle") { await B.db.doc("game/state").update({ nom: t.value.trim().slice(0, 60) }); if (P) P.nom = t.value.trim().slice(0, 60); ui.nomPartieEdit = null; return; }
      if (t.id === "robotStrat") { ui.robotStrat = t.value; return; }
      if (t.dataset.conf) { ui.confier[t.dataset.conf] = t.value; return; }
      if (t.dataset.don) { ui.donner[t.dataset.don] = t.value; return; }
      if (t.dataset.seq) { const seq = Object.assign({}, ST.config.sequenceEvenements || {}); seq[t.dataset.seq] = t.value; return await majConfig("sequenceEvenements", seq); }
      if (t.dataset.param) {
        const k = t.dataset.param;
        if (k === "evenements") return await majConfig(k, t.checked);
        if (k === "coutsTransition") { const ct = t.value.split(/[,;\s]+/).map((x) => Math.round(+x)).filter((x) => x > 0); if (!ct.length) return; while (ct.length < ST.config.nbCheminees) ct.push(ct[ct.length - 1]); return await majConfig(k, ct.slice(0, ST.config.nbCheminees)); }
        const v = parseFloat(t.value); if (isNaN(v)) return;
        if (k === "nbTours") return await majConfig(k, Math.max(4, Math.min(14, Math.round(v))));
        return await majConfig(k, v);
      }
    } catch (e) { err(e); }
  }
  function onInput(ev) {
    const t = ev.target;
    if (t.id === "nomPartie") ui.nomPartie = t.value;
    if (t.id === "nomPartieActuelle") ui.nomPartieEdit = t.value;
    if (t.id === "robotNom") ui.robotNom = t.value;
    if (t.id === "minutes") ui.minutes = t.value;
    if (t.dataset && t.dataset.nom) ui.noms[t.dataset.nom] = t.value;
  }
  function lierJoueur() {
    const dec = decisions[onglet]; if (!dec || partie.termine) return;
    app.querySelectorAll("[data-elec]").forEach((el) => el.addEventListener("change", () => { const k = +el.dataset.elec; dec.electrifier = dec.electrifier.filter((x) => x !== k); if (el.checked) dec.electrifier.push(k); ui.arme = null; render(); }));
    const v = $("#vertes"); if (v) v.addEventListener("change", () => { dec.vertes = +v.value; ui.arme = null; render(); });
    const p = $("#polluantes"); if (p) p.addEventListener("change", () => { dec.polluantes = +p.value; ui.arme = null; render(); });
    const a = $("#prixAchat"); if (a) a.addEventListener("change", () => { dec.prixAchat = Math.max(0, Math.min(partie.config.prixReserve, parseFloat(a.value) || 0)); });
    const s = $("#prixVente"); if (s) s.addEventListener("change", () => { dec.prixVente = Math.max(0, parseFloat(s.value) || 0); });
    const g = $("#garderDroits"); if (g) g.addEventListener("change", () => { dec.garderDroits = g.checked; render(); });
    const st = $("#strategie"); if (st) st.addEventListener("input", () => { dec.texteStrategie = st.value; majBouton(); });
    app.querySelectorAll("[data-etoile]").forEach((b) => b.addEventListener("click", () => { dec.confiance = +b.dataset.etoile; render(); }));
    majBouton();
  }
  function majBouton() {
    const b = $("#soumettre"), m = $("#manque"), cpt = $("#compteur"), dec = decisions[onglet];
    if (cpt && dec) { const k = (dec.texteStrategie || "").trim().length; cpt.textContent = k >= MIN_STRATEGIE ? "Merci." : `Encore ${MIN_STRATEGIE - k} caractère${MIN_STRATEGIE - k > 1 ? "s" : ""} au minimum.`; }
    if (!b || !m || !partie || partie.termine) return;
    const c = T.configTour(partie, partie.tour), e = partie.entreprises[onglet];
    const depasse = T.coutInvestissement(c, e, dec) > T.margeDisponible(c, e), complet = strategieComplete(dec);
    b.disabled = depasse || !complet;
    m.textContent = !complet ? "Écris ta stratégie (au moins " + MIN_STRATEGIE + " caractères) et choisis ta confiance pour soumettre." : "";
  }

})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, query, where, limit, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const msg = (t) => { document.getElementById("app").innerHTML = '<section class="card centre"><h2>Impossible d’ouvrir le jeu</h2><p>' + t + '</p></section>'; };
const C = window.TR_CONFIG;
if (!C || String(C.firebase.apiKey).indexOf("COLLE") >= 0) msg("Le jeu n’est pas encore configuré : il manque les informations Firebase dans le fichier index.html.");
else {
  const app = initializeApp(C.firebase), auth = getAuth(app), fs = getFirestore(app);
  const ref = (p) => doc(fs, ...p.split("/"));
  const wrap = (s) => ({ exists: s.exists(), id: s.id, data: () => s.data() });
  const mkQ = (col, cons) => ({
    where: (f, op, v) => mkQ(col, cons.concat([where(f, op, v)])),
    limit: (n) => mkQ(col, cons.concat([limit(n)])),
    get: async () => { const q = await getDocs(query(collection(fs, col), ...cons)); return { docs: q.docs.map(wrap) }; },
    onSnapshot: (cb, e) => onSnapshot(query(collection(fs, col), ...cons), (q) => cb({ docs: q.docs.map(wrap) }), e),
  });
  const db = { doc: (p) => ({ get: async () => wrap(await getDoc(ref(p))), set: (d) => setDoc(ref(p), d), update: (d) => updateDoc(ref(p), d), delete: () => deleteDoc(ref(p)), onSnapshot: (cb, e) => onSnapshot(ref(p), (s) => cb(wrap(s)), e) }),
    collection: (c) => mkQ(c, []) };
  const save = async (nom, data) => { const b = new Blob([data], { type: nom.endsWith(".csv") ? "text/csv;charset=utf-8" : "text/html;charset=utf-8" }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nom; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); };
  function connexion(texte) {
    document.getElementById("etiquetteTour").textContent = "Connexion enseignant";
    document.getElementById("app").innerHTML = '<section class="card" style="max-width:420px;margin:30px auto"><h2>Connexion enseignant</h2>' + (texte ? '<p style="color:var(--alert)">' + texte + '</p>' : '') +
      '<label class="small">Courriel<input type="text" id="lg-mail" autocomplete="username" style="display:block;width:100%;margin:3px 0 10px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)"></label>' +
      '<label class="small">Mot de passe<input type="password" id="lg-pw" autocomplete="current-password" style="display:block;width:100%;margin:3px 0 10px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)"></label>' +
      '<button class="primary" id="lg-go">Se connecter</button><p class="small muted" style="margin-top:10px">Les étudiant·es n’ont pas besoin de se connecter : ils utilisent le lien sans #admin.</p></section>';
    const go = () => { const m = document.getElementById("lg-mail").value.trim(), p = document.getElementById("lg-pw").value; if (!m || !p) return;
      signInWithEmailAndPassword(auth, m, p).catch((e) => connexion(/invalid|wrong|not-found/.test(String(e.code)) ? "Courriel ou mot de passe incorrect." : "Connexion impossible (" + (e.code || "erreur") + ").")); };
    document.getElementById("lg-go").onclick = go; document.getElementById("lg-pw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }
  let demarre = false;
  onAuthStateChanged(auth, (u) => {
    if (demarre) { location.reload(); return; }
    const prof = !!u && !u.isAnonymous;
    if (location.hash === "#admin" && !prof) { connexion(""); return; }
    if (!u) { signInAnonymously(auth).catch((e) => msg("Connexion impossible (" + (e.code || "erreur") + "). Vérifie que la connexion anonyme est activée dans Firebase.")); return; }
    demarre = true;
    window.demarrerTransition({ db, uid: u.uid, isOwner: prof, save, logout: () => signOut(auth) });
  });
}
</script>
</body>
</html>
